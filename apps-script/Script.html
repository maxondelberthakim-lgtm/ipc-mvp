var L = 'id';
function t(k){ return (T[L] && T[L][k]) || T.id[k] || k; }

function gantiBahasa(){
  L = (L === 'id') ? 'en' : 'id';
  try{ localStorage.setItem('ipc_lang', L); }catch(e){}
  terapkanBahasa();
}
function terapkanBahasa(){
  document.getElementById('btnLang').textContent = (L === 'id') ? 'EN' : 'ID';
  var els = document.querySelectorAll('[data-i18n]');
  for (var i=0;i<els.length;i++){
    var k = els[i].getAttribute('data-i18n');
    if (!T[L][k]) continue;
    var unit = els[i].querySelector('.unit');
    els[i].textContent = T[L][k];
    if (unit) els[i].appendChild(unit);
  }
  if (S.view === 'beli') labelMutasi();
  if (S.view === 'transfer') labelTransfer();
  if (S.view === 'job') segJob(S.jobTab || 'list');
  if (S.view === 'review') muatReview();
  if (S.view === 'report') segRep(S.repTab || 'susut');
  if (S.cal.data) gambarKalender();
  gambarSemuaBaris();
}

  cal:{ bulan:null, data:null, hari:null }, revTab:'MENUNGGU'
};

/* ---------------- helpers ---------------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function n2(v){ return (Math.round(v*100)/100).toLocaleString('id-ID'); }
function kg(v){ return n2(v)+' kg'; }
function rp(v){ var cur = (S.ctx && S.ctx.mataUang) || 'Rp'; return cur+' '+Math.round(v||0).toLocaleString('id-ID'); }
function lihatHpp(){ return !!(S.ctx && S.ctx.lihatHpp); }

function toast(msg, jenis){
  var d = document.createElement('div');
  d.className = 'toast ' + (jenis||'');
  d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(function(){ d.remove(); }, jenis==='bad' ? 4200 : 2600);
}

function panggil(fn, args){
  return new Promise(function(res, rej){
    google.script.run.withSuccessHandler(res).withFailureHandler(function(e){
      rej(new Error(e && e.message ? e.message : String(e)));
    })[fn].apply(null, args||[]);
  });
}

function sibuk(btn, on, teksAsli){
  if(!btn) return;
  btn.disabled = on;
  if (on){ btn.dataset.txt = btn.innerHTML; btn.innerHTML = '<span class="spin"></span> ' + t('menyimpan'); }
  else { btn.innerHTML = teksAsli || btn.dataset.txt || btn.innerHTML; }
}

/* ---------------- navigasi ---------------- */
function tampil(v){
  S.view = v;
  ['ident','home','beli','transfer','job','review','report'].forEach(function(x){
    var el = $('v-'+x); if(el) el.classList.toggle('hide', x !== v);
    var nb = $('nav-'+x); if(nb) nb.classList.toggle('on', x === v);
  });
  window.scrollTo(0,0);
  if (v==='ident')  siapkanIdent();
  if (v==='home')   muatKonteks();
  if (v==='job')    segJob(S.jobTab);
  if (v==='review') muatReview();
  if (v==='report') segRep(S.repTab);
}

/* ---------------- boot ---------------- */
window.addEventListener('DOMContentLoaded', function(){
  try{
    L = localStorage.getItem('ipc_lang') || BAHASA_AWAL || 'id';
    S.ident.nama = localStorage.getItem('ipc_nama') || '';
    S.ident.pin  = localStorage.getItem('ipc_pin')  || '';
  }catch(e){ L = BAHASA_AWAL || 'id'; }
  if (L !== 'id' && L !== 'en') L = 'id';
  terapkanBahasa();
  muatKonteks(true);
});

function muatKonteks(diam){
  panggil('getKonteks',[S.ident]).then(function(c){
    S.ctx = c;
    $('homeIdent').classList.toggle('hide', !c.identitasManual);
    if (c.perluNama){ tampil('ident'); return; }
    $('hdrUser').textContent = c.user.nama + ' · ' + c.user.peran;
    $('sMasuk').textContent  = n2(c.ringkasan.masukHariIni);
    $('sKeluar').textContent = n2(c.ringkasan.keluarHariIni);
    $('sProses').textContent = n2(c.ringkasan.kgSedangDiproses);
    $('sQueue').textContent  = c.ringkasan.menungguReview;
    $('sSusut').textContent  = c.ringkasan.susutTinggiHariIni;
    $('homeRev').classList.toggle('hide', !c.bisaReview);
    $('nav-review').classList.toggle('hide', !c.bisaReview);
    $('segRepHpp').classList.toggle('hide', !c.lihatHpp);
    var cm = $('cntMenunggu'), cd = $('cntDitandai');
    if (cm) cm.textContent = c.ringkasan.menungguReview || '';
    if (cd) cd.textContent = c.ringkasan.ditandai || '';
    muatKalender(S.cal.bulan);
    var b = $('revBadge'), d = $('navDot');
    var ada = c.ringkasan.menungguReview > 0;
    if (b){ b.textContent = c.ringkasan.menungguReview; b.classList.toggle('hide', !ada); }
    if (d) d.classList.toggle('hide', !(ada && c.bisaReview));

/* ---------------- kalender ---------------- */
function bulanStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function geserBulan(n){
  var b = S.cal.bulan ? new Date(S.cal.bulan+'-01T00:00:00') : new Date();
  b.setMonth(b.getMonth()+n);
  S.cal.hari = null;
  muatKalender(bulanStr(b));
}
function muatKalender(bulan){
  panggil('kalender',[bulan || null, S.ident]).then(function(d){
    S.cal.bulan = d.bulan; S.cal.data = d;
    if (!S.cal.hari){
      S.cal.hari = (d.hariIni.indexOf(d.bulan)===0) ? d.hariIni
                 : (d.hari.length ? d.hari[d.hari.length-1].tanggal : null);
    }
    gambarKalender();
  }).catch(function(e){ $('calGrid').innerHTML = '<div class="banner bad">'+esc(e.message)+'</div>'; });
}
function gambarKalender(){
  var d = S.cal.data; if (!d) return;
  var y = parseInt(d.bulan.slice(0,4),10), m = parseInt(d.bulan.slice(5,7),10)-1;
  $('calTitle').textContent = t('bulan')[m]+' '+y;
  var peta = {}; d.hari.forEach(function(h){ peta[h.tanggal]=h; });

  var h = t('hariSingkat').map(function(w){ return '<div class="wd">'+esc(w)+'</div>'; }).join('');
  for (var i=0;i<d.hariPertama;i++) h += '<div></div>';
  for (var day=1; day<=d.jumlahHari; day++){
    var tgl = d.bulan+'-'+String(day).padStart(2,'0');
    var x = peta[tgl];
    var cls = 'd' + (tgl===d.hariIni?' today':'') + (tgl===S.cal.hari?' on':'') + (!x?' mute':'');
    var dots = '';
    if (x){
      if (x.masuk>0)       dots += '<i style="background:var(--ok)"></i>';
      if (x.keluar>0)      dots += '<i style="background:var(--warn)"></i>';
      if (x.job>0)         dots += '<i style="background:#4338ca"></i>';
      if (x.susutTinggi>0) dots += '<i style="background:var(--danger)"></i>';
    }
    var kgTxt = x && x.kg>0 ? Math.round(x.kg) : '';
    h += '<button class="'+cls+'" onclick="pilihHari(\''+tgl+'\')">' +
         '<span class="num">'+day+'</span><span class="dots">'+dots+'</span>' +
         '<span class="kg">'+kgTxt+'</span></button>';
  }
  $('calGrid').innerHTML = h;
  gambarHari();
}
function pilihHari(tgl){ S.cal.hari = tgl; gambarKalender(); }
function warnaEv(j){
  if (j==='MASUK'||j==='RETUR_CUSTOMER') return 'var(--ok)';
  if (j==='KELUAR'||j==='RETUR_SUPPLIER') return 'var(--warn)';
  if (j==='JOB_MULAI'||j==='JOB_SELESAI') return '#4338ca';
  return '#9aa3ad';
}
function gambarHari(){
  var d = S.cal.data, el = $('calDay'); if (!d || !el) return;
  var tgl = S.cal.hari; if (!tgl){ el.innerHTML=''; return; }
  var x = null; d.hari.forEach(function(h){ if (h.tanggal===tgl) x=h; });
  var dd = new Date(tgl+'T00:00:00');
  var judul = dd.getDate()+' '+t('bulan')[dd.getMonth()]+' '+dd.getFullYear()+(tgl===d.hariIni?' · '+t('hariIni'):'');
  if (!x || !x.kejadian.length){
    el.innerHTML = '<div class="dayhead"><b>'+esc(judul)+'</b></div><div style="font-size:12.5px;color:var(--muted)">'+esc(t('hariKosong'))+'</div>';
    return;
  }
  var ring = [];
  if (x.masuk)    ring.push('<span style="color:var(--ok)">+'+n2(x.masuk)+' kg</span>');
  if (x.keluar)   ring.push('<span style="color:var(--warn)">−'+n2(x.keluar)+' kg</span>');
  if (x.job)      ring.push(x.job+' '+t('jobs'));
  if (x.menunggu) ring.push(x.menunggu+' '+t('statQueue').toLowerCase());
  el.innerHTML = '<div class="dayhead"><b>'+esc(judul)+'</b><span>'+ring.join(' · ')+'</span></div>' +
    x.kejadian.map(function(e){
      var st = '';
      if (e.jenis==='JOB_SELESAI'){
        st = (e.status && e.status!=='NORMAL') ? ' <span class="pill bad">'+esc(t('susutTinggi'))+'</span>' : '';
      } else if (e.status==='MENUNGGU') st = ' <span class="pill warn">'+esc(t('segMenunggu'))+'</span>';
      else if (e.status==='DITANDAI') st = ' <span class="pill n">'+esc(t('segDitandai'))+'</span>';
      var sub = e.item ? esc(e.item)+' · '+esc(e.label) : esc(e.label);
      if (e.jenis==='JOB_SELESAI') sub += ' · '+esc(t('susut'))+' '+n2(e.susut)+' kg ('+n2(e.persen)+'%)';
      return '<div class="ev"><span class="jm">'+esc(e.jam)+'</span><span class="tp" style="background:'+warnaEv(e.jenis)+'"></span>' +
        '<span class="tx"><b>'+esc(t('ev'+e.jenis))+'</b>'+st+'<small>'+sub+' · '+esc(e.oleh)+'</small></span>' +
        '<span class="q">'+n2(e.qty)+' kg</span></div>';
    }).join('');
}

var MODE_BARIS = { rcv:'all', trf:'all', job:'bahan', finJadi:'jadi', finScrap:'all' };
var WADAH = { rcv:'rcvLines', trf:'trfLines', job:'jobLines', finJadi:'finJadiLines', finScrap:'finScrapLines' };

function tambahBaris(k){ S.baris[k].push({ kode:'', qty:'' }); gambarBaris(k); }
function hapusBaris(k, i){
  S.baris[k].splice(i,1);
  if (!S.baris[k].length) S.baris[k].push({ kode:'', qty:'' });
  gambarBaris(k);

function ubahBaris(k, i, field, val){
  S.baris[k][i][field] = val;
  if (k === 'finJadi' || k === 'finScrap') hitungPreviewSusut();
  if (k === 'job') ringkasJobBaru();
}
function gambarSemuaBaris(){ Object.keys(WADAH).forEach(gambarBaris); }

function gambarBaris(k){
  var el = $(WADAH[k]); if(!el) return;
  if (!S.baris[k].length) S.baris[k] = [{ kode:'', qty:'' }];
  var opts = itemsFilter(MODE_BARIS[k]);
  el.innerHTML = S.baris[k].map(function(b, i){
    var sel = '<select onchange="ubahBaris(\''+k+'\','+i+',\'kode\',this.value)">' +
      '<option value="">'+esc(t('pilihItem'))+'</option>' +
      opts.map(function(o){
        return '<option value="'+esc(o.kode)+'"'+(o.kode===b.kode?' selected':'')+'>'+esc(o.nama)+'</option>';
      }).join('') + '</select>';
    return '<div class="line">' +
      '<div class="top"><span class="no">#'+(i+1)+'</span>' +
        (S.baris[k].length>1 ? '<button class="x" onclick="hapusBaris(\''+k+'\','+i+')">✕ '+esc(t('hapus'))+'</button>' : '') +
      '</div>' + sel +
      '<div class="row" style="margin-top:8px">' +
        '<input type="number" inputmode="decimal" step="any" min="0" placeholder="'+esc(t('qty'))+'" value="'+esc(b.qty)+'" oninput="ubahBaris(\''+k+'\','+i+',\'qty\',this.value)">' +
        '<div class="w90"><input value="kg" readonly style="background:#f3f4f6;text-align:center;font-weight:650"></div>' +
      '</div></div>';
  }).join('');
}

function ambilBaris(k){
  return S.baris[k].filter(function(b){ return b.kode && parseFloat(b.qty) > 0; })
                   .map(function(b){ return { kode:b.kode, qty:parseFloat(b.qty) }; });
}
function totalBaris(k){
  return S.baris[k].reduce(function(a,b){ var q = parseFloat(b.qty); return a + (isNaN(q)?0:q); }, 0);
}
function namaItem(kode){
  if (!S.ctx) return kode;
  for (var i=0;i<S.ctx.items.length;i++) if (S.ctx.items[i].kode===kode) return S.ctx.items[i].nama;
  return kode;
}

var KOTAK = { rcv:'rcvPhoto', trf:'trfPhoto', job:'jobPhoto', fin:'finPhoto' };
var FILEIN = { rcv:'rcvFile', trf:'trfFile', job:'jobFile', fin:'finFile' };

function pilihFoto(k){ $(FILEIN[k]).click(); }

function fotoTerpilih(ev, k){
  var f = ev.target.files && ev.target.files[0];
  if(!f) return;
  kecilkanGambar(f, 1400, 0.72).then(function(dataUrl){
    S.foto[k] = dataUrl;
    var box = $(KOTAK[k]);
    box.className = 'photo filled';
    box.innerHTML = '<img src="'+dataUrl+'">';
    if (k === 'rcv'){
      $('rcvOcrRow').classList.remove('hide');
      $('ocrHasil').innerHTML = ''; S.ocr = null;
      $('btnOcr').classList.toggle('hide', !(S.ctx && S.ctx.ocrAktif && S.modeExt === 'BELI_MASUK'));
    }
    if (k === 'trf') $('trfFotoRow').classList.remove('hide');
  }).catch(function(){ toast(t('gagal'),'bad'); });
  ev.target.value = '';
}

function hapusFoto(k){
  S.foto[k] = null;
  var box = $(KOTAK[k]);
  box.className = 'photo';
  var hint = (k==='rcv') ? (S.modeExt.indexOf('JUAL')===0 ? t('fotoHintKirim') : t('fotoHintSJ'))
           : (k==='trf' ? t('fotoHint') : '');
  box.innerHTML = '<div class="p1">📷 '+esc(t('fotoAmbil'))+'</div>' +
                  (hint ? '<div class="p2">'+esc(hint)+'</div>' : '');
  if (k==='rcv'){ $('rcvOcrRow').classList.add('hide'); $('ocrHasil').innerHTML=''; S.ocr=null; }
  if (k==='trf'){ $('trfFotoRow').classList.add('hide'); }
}

function kecilkanGambar(file, maxSisi, mutu){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var sk = Math.min(1, maxSisi / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width*sk); c.height = Math.round(img.height*sk);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', mutu));
      };
      img.onerror = rej; img.src = e.target.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

function modeInfo(){
  var m = S.modeExt;
  return {
    jual   : m.indexOf('JUAL') === 0,
    judul  : m==='BELI_MASUK' ? t('beliT')  : m==='BELI_RETUR' ? t('returT')
           : m==='JUAL_KELUAR'? t('jualT')  : t('returCustT'),
    sub    : m==='BELI_MASUK' ? t('beliS')  : m==='BELI_RETUR' ? t('returS')
           : m==='JUAL_KELUAR'? t('jualS')  : t('returCustS'),

  };
}

function labelMutasi(){
  var i = modeInfo();
  $('rcvJudul').textContent = i.judul;
  $('rcvSub').textContent   = i.sub;
  $('rcvPartnerLabel').textContent = i.jual ? t('lblCustomer') : t('lblSupplier');
  $('rcvFotoLabel').textContent = i.jual ? t('lblFotoKirim')
                                : (S.modeExt==='BELI_MASUK' ? t('lblFotoSJ') : t('lblFoto'));
  $('rcvSJWrap').classList.toggle('hide', !i.pakaiSJ);
  var lbl = $('rcvSJWrap').querySelector('label');
  if (lbl) lbl.textContent = i.jual ? t('lblNoDO') : t('lblNoSJ');
  var ocrBtn = $('btnOcr');
  if (ocrBtn) ocrBtn.classList.toggle('hide', !(i.pakaiOcr && S.ctx && S.ctx.ocrAktif));
}

function simpanMutasiUI(){
  var i = modeInfo();
  var baris = ambilBaris('rcv');
  var partner = $('rcvPartner').value;
  if (!partner){ toast(i.jual ? t('wajibCustomer') : t('wajibSupplier'),'bad'); return; }
  if (!S.foto.rcv){ toast(t('wajibFoto'),'bad'); return; }
  if (S.modeExt==='BELI_MASUK' && !$('rcvNoSJ').value.trim()){ toast(t('wajibSJ'),'bad'); return; }
  if (S.modeExt==='JUAL_KELUAR' && S.ctx && S.ctx.wajibSjKeluar && !$('rcvNoSJ').value.trim()){
    toast(t('wajibSJKeluar'),'bad'); return;
  }
  if (!baris.length){ toast(t('wajibItem'),'bad'); return; }

  var b = $('btnSimpanRcv'); sibuk(b, true);
  var fn, payload;
  if (i.jual){
    fn = 'simpanPengiriman';
    payload = { jenis: S.modeExt==='JUAL_KELUAR' ? 'KELUAR' : 'RETUR_MASUK', customer: partner };
  } else {
    fn = 'simpanPenerimaan';
    payload = { jenis: S.modeExt==='BELI_MASUK' ? 'MASUK' : 'RETUR', supplier: partner,
                qtyOcr: (S.ocr && S.ocr.qtySaran) || '' };
  }
  payload.noSuratJalan = $('rcvNoSJ').value;
  payload.baris = baris;
  payload.catatan = $('rcvCatatan').value;
  payload.foto = S.foto.rcv;
  payload.ident = S.ident;

  panggil(fn, [payload]).then(function(r){
    sibuk(b, false, t('btnSimpan'));
    toast(t('tersimpan') + ' · ' + kg(r.totalKg), 'ok');
    bukaMutasi(S.modeExt);
    tampil('home');
  }).catch(function(e){ sibuk(b,false,t('btnSimpan')); toast(e.message,'bad'); });
}

function jalankanOcr(){
  if (!S.foto.rcv || S.modeExt !== 'BELI_MASUK') return;
  if (S.ctx && !S.ctx.ocrAktif){ toast(t('ocrMati'),'bad'); return; }
  var b = $('btnOcr'); var asli = b.innerHTML;
  b.disabled = true; b.innerHTML = '<span class="spin"></span> ' + t('ocrJalan');
  panggil('ocrSuratJalan', [S.foto.rcv]).then(function(r){
    b.disabled = false; b.innerHTML = asli;
    if (!r.ok){ $('ocrHasil').innerHTML = '<div class="banner warn">'+esc(r.pesan||t('gagal'))+'</div>'; return; }
    S.ocr = r;
    if (r.noSuratJalan && !$('rcvNoSJ').value) $('rcvNoSJ').value = r.noSuratJalan;
    if (!r.kandidatQty || !r.kandidatQty.length){
      $('ocrHasil').innerHTML = '<div class="banner warn">'+esc(t('ocrTidakKetemu'))+'</div>'; return;
    }
    $('ocrHasil').innerHTML = '<div class="banner ok"><b>'+esc(t('ocrSaran'))+':</b>' +
      r.kandidatQty.slice(0,4).map(function(c){
        return '<div style="margin-top:6px;display:flex;align-items:center;gap:8px">' +
          '<b style="font-variant-numeric:tabular-nums">'+n2(c.qty)+' '+esc(c.satuan)+'</b>' +

      }).join('') + '</div>';
  }).catch(function(e){
    b.disabled = false; b.innerHTML = asli;
    $('ocrHasil').innerHTML = '<div class="banner bad">'+esc(e.message)+'</div>';
  });
}

function bukaTutupJob(id){
  panggil('daftarPekerjaanBerjalan',[S.ident]).then(function(rows){
    var j = null;
    rows.forEach(function(r){ if (r.id === id) j = r; });
    if (!j) return;
    S.jobAktif = j;
    S.baris.finJadi  = [{ kode:j.kodeProduk, qty:'' }];
    S.baris.finScrap = [{ kode:'', qty:'' }];
    S.foto.fin = null; hapusFoto('fin');
    $('finCatatan').value = '';
    $('jobFinHead').innerHTML =
      '<div class="jobhead">' +
        '<div class="p">'+esc(j.produk)+'</div>' +
        '<div class="bigrow" style="margin-top:5px"><span class="big">'+n2(j.totalKg)+'<span class="u">kg</span></span>' +
          '<span style="font-size:12.5px;color:#3f6f6a">'+esc(t('bahanMasuk'))+'</span></div>' +
        '<div class="k">' + j.bahan.map(function(b){ return esc(b.nama)+' '+n2(b.qty)+' kg'; }).join(' · ') + '</div>' +
      '</div>';
    gambarBaris('finJadi'); gambarBaris('finScrap');
    hitungPreviewSusut();
    $('jobList').classList.add('hide'); $('jobNew').classList.add('hide');
    $('jobHasil').classList.add('hide');
    $('jobFinish').classList.remove('hide');
    window.scrollTo(0,0);
  });
}

function hitungPreviewSusut(){
  if (!S.jobAktif) return;
  var masuk = S.jobAktif.totalKg;
  var jadi = totalBaris('finJadi'), scrap = totalBaris('finScrap');
  var susut = masuk - jadi - scrap;
  var persen = masuk > 0 ? (susut/masuk)*100 : 0;
  var batas = S.jobAktif.batas || 4.5;
  var kelas = 'banner ok', label = t('susutNormal');
  if (persen < 0){ kelas = 'banner bad'; label = t('susutAnomali'); }
  else if (persen > batas){ kelas = 'banner warn'; label = t('susutTinggi'); }

  /* susutnya dari bahan apa — proporsional terhadap kg masuk */
  var rincian = '';
  if (susut > 0 && S.jobAktif.bahan.length > 1){
    rincian = '<div style="margin-top:8px;padding-top:8px;border-top:1px dashed rgba(0,0,0,.15);font-size:12px">' +
      S.jobAktif.bahan.map(function(b){
        return esc(b.nama)+' <b>'+n2(susut * (b.qty/masuk))+' kg</b>';
      }).join(' · ') + '</div>';
  }

  $('susutPreview').className = kelas;
  $('susutPreview').innerHTML =
    '<div class="bigrow"><span class="big" style="font-size:26px">'+n2(susut)+'<span class="u">kg</span></span>' +
    '<span style="font-size:15px;font-weight:700">'+n2(persen)+'%</span>' +
    '<span style="margin-left:auto;font-size:11.5px;font-weight:700">'+esc(label)+'</span></div>' +
    '<div style="font-size:12px;margin-top:4px;opacity:.85">' +
      n2(masuk)+' − '+n2(jadi)+' − '+n2(scrap)+' = '+n2(susut)+' kg · '+esc(t('batasNormal'))+' '+n2(batas)+'%</div>' +
    rincian;
}

function tutupJobUI(){
  var jadi = ambilBaris('finJadi');
  if (!jadi.length){ toast(t('wajibItem'),'bad'); return; }
  var b = $('btnTutupJob'); sibuk(b, true);
  panggil('selesaikanPekerjaan', [{
    id: S.jobAktif.id, barangJadi: jadi, scrap: ambilBaris('finScrap'),

}

  var rincian = (r.rincian && r.rincian.length) ?
    '<h3 class="sec" style="margin-top:16px">'+esc(t('susutDari'))+'</h3>' +
    r.rincian.map(function(x){
      var lebar = r.susut > 0 ? Math.max(2, (x.susut / r.susut) * 100) : 0;
      return '<div class="listrow"><div style="display:flex;align-items:baseline;gap:9px">' +
        '<b style="flex:1;font-size:13.5px">'+esc(x.nama)+'</b>' +
        '<span style="font-weight:700;font-variant-numeric:tabular-nums;color:'+warna+'">'+n2(x.susut)+' kg</span></div>' +
        '<div class="bar"><i style="width:'+lebar+'%;background:'+warna+'"></i></div>' +
        '<div style="font-size:11.5px;color:var(--muted)">'+n2(x.masuk)+' kg '+esc(t('dari'))+' '+n2(r.masuk)+' kg ('+n2(x.porsi)+'%)</div>' +
      '</div>';
    }).join('') : '';

  $('jobHasil').innerHTML = '<div class="card">' +
    '<h2>'+esc(t('tutupBerhasil'))+'</h2><div class="sub">'+esc(r.produk)+'</div>' +
    '<div class="bigrow"><span class="big" style="color:'+warna+'">'+n2(r.susut)+'<span class="u">kg</span></span>' +
      '<span style="font-size:17px;font-weight:700;color:'+warna+'">'+n2(r.persen)+'%</span>' +
      '<span style="margin-left:auto">'+pillSusut(r.status)+'</span></div>' +
    '<div class="bar"><i style="width:'+Math.max(2,Math.min(100,(r.persen/Math.max(r.batas*2,.1))*100))+'%;background:'+warna+'"></i><u style="left:50%"></u></div>' +
    '<div style="font-size:12px;color:var(--muted)">'+
      esc(t('bahanMasuk'))+' '+n2(r.masuk)+' − '+esc(t('barangJadi'))+' '+n2(r.jadi)+' − '+esc(t('scrap'))+' '+n2(r.scrap)+
      ' = '+n2(r.susut)+' kg · '+esc(t('batasNormal'))+' '+n2(r.batas)+'%</div>' +
    rincian +
    (r.hpp ? '<h3 class="sec" style="margin-top:16px">'+esc(t('hpp'))+'</h3>' +
      '<div class="tot" style="margin-bottom:0">' +
        '<div class="wide"><div class="n" style="font-size:24px">'+rp(r.hpp.perKg)+'<span style="font-size:12px;color:var(--muted)"> / kg</span></div><div class="l">'+esc(t('hppPerKg'))+'</div></div>' +
        '<div><div class="n" style="font-size:16px">'+rp(r.hpp.total)+'</div><div class="l">'+esc(t('hppTotal'))+'</div></div>' +
        '<div><div class="n" style="font-size:16px;color:var(--danger)">'+rp(r.hpp.nilaiSusut)+'</div><div class="l">'+esc(t('nilaiSusut'))+'</div></div>' +
      '</div>' : '') +
    '<button class="btn" style="margin-top:16px" onclick="segJob(\'list\')">'+esc(t('selesai'))+'</button>' +
  '</div>';
  $('jobFinish').classList.add('hide');
  $('jobList').classList.add('hide');
  $('jobHasil').classList.remove('hide');
  window.scrollTo(0,0);
}

function segRev(tab){
  S.revTab = tab;
  $('segRevMenunggu').classList.toggle('on', tab==='MENUNGGU');
  $('segRevDitandai').classList.toggle('on', tab==='DITANDAI');
  muatReview();
}
function muatReview(){
  var arsip = S.revTab === 'DITANDAI';
  $('revHint').textContent = arsip ? t('hintDitandai') : t('hintMenunggu');
  $('revList').innerHTML = '<div class="load">…</div>';
  panggil('antrianReview',[S.ident, S.revTab]).then(function(rows){
    if (!rows.length){
      $('revList').innerHTML = '<div class="empty"><span class="g">'+(arsip?'🗂️':'✅')+'</span>'+esc(arsip?t('kosongDitandai'):t('kosongRev'))+'</div>';
      return;
    }
    $('revList').innerHTML = rows.map(function(r){
      var src = (r.foto && r.foto.indexOf('data:') === 0) ? r.foto
              : (r.fotoId ? 'https://drive.google.com/thumbnail?id='+r.fotoId+'&sz=w1000' : '');
      var img = src ? '<img class="ph" src="'+esc(src)+'" onerror="this.style.display=\'none\'">' : '';
      var ocr = '';
      if (r.qtyOcr != null){
        var cocok = Math.abs(r.selisih == null ? 0 : r.selisih) < 0.001;
        ocr = '<div class="kv"><span>OCR</span><b>'+n2(r.qtyOcr)+' kg</b></div>' +
              '<div class="kv"><span>'+esc(cocok ? t('ocrCocok') : t('ocrBeda'))+'</span>' +
              '<b style="color:'+(cocok?'var(--ok)':'var(--danger)')+'">' +
              (cocok ? '✓' : (r.selisih>0?'+':'')+n2(r.selisih)+' kg') + '</b></div>';
      }
      var tag = r.jenis === 'RETUR' ? '<span class="pill bad">RETUR</span>'
              : r.jenis === 'RETUR_MASUK' ? '<span class="pill warn">RETUR CUST</span>'
              : r.jenis === 'KELUAR' ? '<span class="pill warn">KELUAR</span>'
              : r.sumber === 'PENERIMAAN' ? '<span class="pill ok">MASUK</span>'
              : '<span class="pill n">'+esc(r.label)+'</span>';
      return '<div class="rev" id="rev-'+esc(r.id)+'">' + img +
        '<div class="body">' +
          '<div style="display:flex;align-items:flex-start;gap:10px">' +
            '<div style="flex:1">' +
              '<div class="qty">'+n2(r.qty)+' <span style="font-size:14px;font-weight:600;color:var(--muted)">kg</span></div>' +
              '<div style="font-weight:600;font-size:13.5px;margin-top:2px">'+esc(r.item)+'</div>' +
              '<div class="meta">'+(r.sumber!=='TRANSFER' ? esc(r.label)+' · ' : '')+esc(r.waktu)+' · '+esc(r.pencatat)+'</div>' +
            '</div>' + tag +
          '</div>' + ocr +
          (r.noSuratJalan ? '<div class="kv"><span>'+esc(t('thSJ'))+'</span><b>'+esc(r.noSuratJalan)+'</b></div>' : '') +
          (r.catatan ? '<div class="kv"><span>'+esc(t('lblCatatan'))+'</span><b>'+esc(r.catatan)+'</b></div>' : '') +
          (r.catatanTinjau ? '<div class="kv"><span>'+esc(t('catatanTinjau'))+'</span><b>'+esc(r.catatanTinjau)+'</b></div>' : '') +
          '<div class="btnrow" style="margin-top:11px">' +
            '<button class="btn ghost" onclick="tinjau(\''+esc(r.id)+'\',\'batal\')">✕ '+esc(t('batal'))+'</button>' +
            (arsip ? '' : '<button class="btn warn" onclick="tinjau(\''+esc(r.id)+'\',\'tandai\')">⚑ '+esc(t('tandai'))+'</button>') +
            '<button class="btn ok" onclick="tinjau(\''+esc(r.id)+'\',\'setuju\')">✓ '+esc(t('setuju'))+'</button>' +
          '</div>' +
        '</div></div>';
    }).join('');
  }).catch(function(e){ $('revList').innerHTML = '<div class="banner bad">'+esc(e.message)+'</div>'; });
}

function tinjau(id, aksi){
  var catatan = '';
  if (aksi === 'tandai'){ catatan = window.prompt(t('alasanTandai')); if (catatan === null) return; }
  if (aksi === 'batal'){  catatan = window.prompt(t('alasanBatal'));  if (catatan === null) return; }
  var card = $('rev-'+id);
  if (card) card.style.opacity = .45;
  panggil('tinjauTransfer', [id, aksi, catatan || '', S.ident]).then(function(){
    if (card) card.remove();
    toast(aksi==='setuju' ? t('disetujui') : aksi==='batal' ? t('dibatalkan') : t('ditandai'),
          aksi==='setuju' ? 'ok' : '');
    muatKonteks(true);
    if (!document.querySelectorAll('.rev').length) muatReview();
  }).catch(function(e){
    if (card) card.style.opacity = 1;
    toast(e.message,'bad');
  });
}

  ['susut','stok','beli','jual','trf','hpp'].forEach(function(x){

function pillSusut(st){
  if (st==='NORMAL')  return '<span class="pill ok">NORMAL</span>';
  if (st==='TINGGI')  return '<span class="pill bad">'+esc(t('susutTinggi'))+'</span>';
  if (st==='ANOMALI') return '<span class="pill bad">ANOMALI</span>';
  return '<span class="pill n">'+esc(st||'—')+'</span>';
}

var STOK_CACHE = {};

function toggleNeraca(kode){
  var el = $('nr-'+kode), cv = $('cv-'+kode);
  if (!el) return;
  if (!el.classList.contains('hide')){
    el.classList.add('hide'); if (cv) cv.textContent = '▾'; return;
  }
  el.innerHTML = gambarNeraca(STOK_CACHE[kode]);
  el.classList.remove('hide');
  if (cv) cv.textContent = '▴';
}

/** Satu baris neraca: label, tanda (+/−), nilai. */
function brs(label, nilai, tanda){
  if (!nilai) return '';
  var warna = tanda === '+' ? 'var(--ok)' : 'var(--danger)';
  return '<div class="nrow"><span>'+esc(label)+'</span>' +
         '<b style="color:'+warna+'">'+tanda+n2(Math.abs(nilai))+'</b></div>';
}
function brsAwal(label, nilai){
  return '<div class="nrow"><span>'+esc(label)+'</span><b>'+n2(nilai)+'</b></div>';
}
function brsTotal(label, nilai){
  return '<div class="nrow tot2"><span>'+esc(label)+'</span>' +
         '<b'+(nilai<0?' style="color:var(--danger)"':'')+'>'+n2(nilai)+' kg</b></div>';
}

/**
 * Neraca per item — dibaca dari atas ke bawah seperti buku kas.
 * GBJ = awal + beli − retur supplier + retur customer − terjual − kirim ke GP + balik dari GP
 * GP  = awal + kirim ke GP − balik ke GBJ − dipakai + dihasilkan
 */
function gambarNeraca(s){
  if (!s) return '';
  var gbj =
    '<div class="nblok"><div class="nhead">'+esc(t('nrGudang'))+' · GBJ</div>' +
      brsAwal(t('nrStokAwal'), s.awalGBJ) +
      brs(t('nrBeli'),      s.beli,      '+') +
      brs(t('nrReturCust'), s.returCust, '+') +
      brs(t('nrKeGBJ'),     s.keGBJ,     '+') +
      brs(t('nrReturSup'),  s.retur,     '−') +
      brs(t('nrJual'),      s.jual,      '−') +
      brs(t('nrKeGP'),      s.keGP,      '−') +
      brsTotal(t('nrSisaGBJ'), s.gbj) +
    '</div>';

  var adaGP = s.awalGP || s.keGP || s.keGBJ || s.dipakai || s.dihasilkan;
  var gp = !adaGP ? '' :
    '<div class="nblok"><div class="nhead">'+esc(t('nrProduksi'))+' · GP</div>' +
      brsAwal(t('nrStokAwal'), s.awalGP) +
      brs(t('nrDariGudang'), s.keGP,       '+') +
      brs(t('nrDihasilkan'), s.dihasilkan, '+') +
      brs(t('nrKeGudang'),   s.keGBJ,      '−') +
      brs(t('nrDipakai'),    s.dipakai,    '−') +
      brsTotal(t('nrSisaGP'), s.gp) +
    '</div>';

  return gbj + gp +
    '<div class="nrow grand"><span>'+esc(t('nrTotal'))+'</span>' +
    '<b'+(s.total<0?' style="color:var(--danger)"':'')+'>'+n2(s.total)+' kg</b></div>';
}

function pillStatus(st){
  if (st==='DISETUJUI') return '<span class="pill ok">'+esc(t('disetujui'))+'</span>';
  if (st==='DITANDAI')   return '<span class="pill n">'+esc(t('ditandai'))+'</span>';
  if (st==='DIBATALKAN') return '<span class="pill bad">'+esc(t('dibatalkan'))+'</span>';
  return '<span class="pill warn">'+esc(st)+'</span>';
}
