<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>H-Plast IPC — pindah ke h-plast.pages.dev</title>
<meta http-equiv="refresh" content="0; url=https://h-plast.pages.dev/">
<link rel="canonical" href="https://h-plast.pages.dev/">
<script>
  /* Aplikasi IPC sudah pindah ke https://h-plast.pages.dev — hapus service worker lama di github.io lalu pindah. */
  try {
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
    if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
  } catch (e) {}
  location.replace('https://h-plast.pages.dev/' + location.search + location.hash);
</script>
